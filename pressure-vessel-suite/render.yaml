services:
  - type: web
    name: basincli-kap-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_MODE
        value: anonymous
      - key: AUTH_DISABLED
        sync: false
      - key: GEOMETRY_AGENT_ENABLED
        sync: false
