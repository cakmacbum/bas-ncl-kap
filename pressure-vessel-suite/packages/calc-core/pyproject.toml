[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pv-calc-core"
version = "0.1.0"
description = "Ortak hesap altyapısı — CalculationResult + DesignCode arayüzü"
requires-python = ">=3.11"
dependencies = ["pv-domain", "pv-units"]

[tool.hatch.build.targets.wheel]
packages = ["src/calc_core"]
