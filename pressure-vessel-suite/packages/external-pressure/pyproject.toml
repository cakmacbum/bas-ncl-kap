[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pv-external-pressure"
version = "0.1.0"
description = "Dış basınç ve vakum stabilite hesabı (ASME UG-28) — Pressure Vessel Suite"
requires-python = ">=3.11"
dependencies = ["pv-calc-core", "pv-domain", "pv-units"]

[tool.hatch.build.targets.wheel]
packages = ["src/external_pressure"]
