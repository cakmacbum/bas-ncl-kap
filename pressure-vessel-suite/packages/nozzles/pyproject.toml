[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pv-nozzles"
version = "0.1.0"
description = "Açıklık ve takviye hesapları — Pressure Vessel Suite"
requires-python = ">=3.11"
dependencies = ["pv-calc-core", "pv-domain"]

[tool.hatch.build.targets.wheel]
packages = ["src/nozzles"]
