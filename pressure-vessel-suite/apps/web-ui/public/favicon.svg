<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Koyu yuvarlatılmış kare zemin -->
  <rect width="48" height="48" rx="10" fill="#0F172A" />
  <!-- Gövde: ASME elipsoidal bombeli silindirik basınçlı kap -->
  <path d="M 14 17 H 34 A 7 8 0 0 1 34 33 H 14 A 7 8 0 0 1 14 17 Z" stroke="#E8EEF5" stroke-width="2" stroke-linejoin="round" />
  <!-- Tanjant / kaynak dikiş hatları -->
  <line x1="14" y1="18" x2="14" y2="32" stroke="#E8EEF5" stroke-width="1" stroke-dasharray="2 2" opacity="0.35" />
  <line x1="34" y1="18" x2="34" y2="32" stroke="#E8EEF5" stroke-width="1" stroke-dasharray="2 2" opacity="0.35" />
  <!-- Üst nozul ve flanş -->
  <path d="M 21 17 V 10 H 27 V 17" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round" />
  <line x1="18" y1="9" x2="30" y2="9" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <!-- İç vurgu: eksen çizgisi -->
  <line x1="10" y1="25" x2="38" y2="25" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 2.5" opacity="0.85" />
  <!-- Eyer mesnetler (ayaklar) -->
  <path d="M 14 33 L 13 41 M 18 33 L 19 41 M 11 41 H 21" stroke="#E8EEF5" stroke-width="2" stroke-linecap="round" />
  <path d="M 30 33 L 29 41 M 34 33 L 35 41 M 27 41 H 37" stroke="#E8EEF5" stroke-width="2" stroke-linecap="round" />
</svg>
